services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailapt-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      # without this every rebuild wipes the session files and logs you out
      - sessions:/app/flask_session
    networks:
      - mailapt-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mailapt-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - mailapt-net

  db:
    image: postgres:16
    container_name: mailapt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mailapt-net

networks:
  mailapt-net:

volumes:
  pgdata:
  sessions:
